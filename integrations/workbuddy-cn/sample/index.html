<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>一点、四边、三线</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    html, body { margin: 0; background: #1c1915; }
    @font-face {
      font-family: "Sample CJK";
      src: local("WenQuanYi Micro Hei"), local("PingFang SC"), local("Hiragino Sans GB"), local("Noto Sans CJK SC"), local("Microsoft YaHei"), local("Droid Sans Fallback");
      font-weight: 400;
    }
    @font-face {
      font-family: "Sample CJK";
      src: local("WenQuanYi Micro Hei"), local("PingFang SC"), local("Hiragino Sans GB"), local("Noto Sans CJK SC"), local("Microsoft YaHei"), local("Droid Sans Fallback");
      font-weight: 700;
    }
    #main {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #1c1915;
      color: #f4efe4;
      font-family: "Sample CJK", sans-serif;
    }
    #progress-rail {
      position: absolute;
      left: 120px;
      right: 120px;
      bottom: 72px;
      height: 8px;
      background: rgba(244, 239, 228, 0.16);
      z-index: 5;
    }
    #progress {
      width: 100%;
      height: 100%;
      background: #e25b2a;
      transform-origin: left center;
      transform: scaleX(0);
    }
  </style>
</head>
<body>
  <main id="main" data-composition-id="main" data-hf-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080" data-fps="30">
    <div id="scene-circle" class="clip" data-hf-id="scene-circle" data-composition-id="circle" data-composition-src="compositions/circle.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    <div id="scene-square" class="clip" data-hf-id="scene-square" data-composition-id="square" data-composition-src="compositions/square.html" data-start="5" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    <div id="scene-lines" class="clip" data-hf-id="scene-lines" data-composition-id="lines" data-composition-src="compositions/lines.html" data-start="10" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    <div id="scene-hold" class="clip" data-hf-id="scene-hold" data-composition-id="hold" data-composition-src="compositions/hold.html" data-start="15" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    <div id="progress-rail" data-hf-id="progress-rail"><div id="progress" data-hf-id="progress"></div></div>
  </main>
  <script>
    const mainTimeline = gsap.timeline({ paused: true });
    mainTimeline.fromTo('#progress', { scaleX: 0 }, { scaleX: 1, duration: 20, ease: 'none' }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines.main = mainTimeline;
  </script>
</body>
</html>
